# Every push to main ships a Windows release that installed copies pick up
# through the in-app "New update available" notice (electron-updater reads
# the latest GitHub Release). Version = major.minor from package.json +
# the workflow run number as patch, so each push is strictly newer — bump
# major/minor in package.json by hand when you want a bigger jump.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Set version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version.Split('.')
          $version = "$($v[0]).$($v[1]).$env:GITHUB_RUN_NUMBER"
          npm pkg set version=$version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Releasing $version"

      # published (non-draft) GitHub releases need their tag to exist first
      - name: Tag release
        shell: pwsh
        run: |
          git tag "v$env:VERSION"
          git push origin "v$env:VERSION"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Build only — electron-builder's in-process GitHub upload can exit 0
      # mid-upload (v0.2.3 shipped with just the blockmap), so publishing is
      # a separate, verified step below.
      - name: Build installer
        run: pnpm dist:win

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(
            "release/Terrarium-Setup-$env:VERSION.exe",
            "release/Terrarium-Setup-$env:VERSION.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "missing build output: $f" } }
          gh release create "v$env:VERSION" --title "$env:VERSION" --notes "" --latest
          gh release upload "v$env:VERSION" @files --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }

      # the updater needs both the installer and latest.yml on the release
      - name: Verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = gh release view "v$env:VERSION" --json assets --jq '.assets[].name'
          foreach ($need in @("Terrarium-Setup-$env:VERSION.exe", "latest.yml")) {
            if ($assets -notcontains $need) { throw "release v$env:VERSION is missing $need" }
          }
          Write-Host "v$env:VERSION published with: $($assets -join ', ')"
